name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan the complete Git history for secrets
        run: >-
          docker run --rm
          -v "$PWD:/repo" -w /repo
          zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git --redact --no-banner --no-color --log-opts=--all .

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: gallery_e2e
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gallery_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      E2E_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/gallery_e2e?schema=public
      E2E_DB_HOST: 127.0.0.1
      E2E_DB_PORT: 5432
      TELEGRAM_BOT_TOKEN: 123456:test-only-token
      TELEGRAM_BOT_USERNAME: test_gallery_bot
      TELEGRAM_ADMIN_APP_SHORT_NAME: admin_app
      TELEGRAM_GALLERY_APP_SHORT_NAME: gallery_app
      ADMIN_TG_IDS: 1,2
      TELEGRAM_INIT_DATA_MAX_AGE_SECONDS: 3600
      R2_ACCOUNT_ID: test-account
      R2_ACCESS_KEY_ID: test-access-key
      R2_SECRET_ACCESS_KEY: test-secret-key
      R2_BUCKET: test-bucket
      WEB_ORIGINS: ""
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit:dependencies
      - run: pnpm check
      - run: pnpm build

  container:
    needs: [secrets, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Build the traceable CI image
        run: >-
          docker build
          --build-arg BUILD_CREATED="$(git show -s --format=%cI HEAD)"
          --build-arg BUILD_REVISION="$GITHUB_SHA"
          --build-arg BUILD_SOURCE="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          --build-arg BUILD_SOURCE_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/tree/$GITHUB_SHA"
          --build-arg BUILD_VERSION="0.0.0-ci.$GITHUB_RUN_NUMBER"
          --tag my-telegram-gallery:ci .
      - name: Verify non-root runtime
        run: test "$(docker inspect --format '{{.Config.User}}' my-telegram-gallery:ci)" = node
      - name: Verify source revision label
        run: >-
          test "$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' my-telegram-gallery:ci)" = "$GITHUB_SHA"
      - name: Smoke the self-host stack
        env:
          SMOKE_BUILD: "false"
          SMOKE_IMAGE: my-telegram-gallery:ci
        run: bash scripts/smoke-self-host.sh
