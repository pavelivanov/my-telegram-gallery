name: Release candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Non-production candidate version, for example 0.1.0-rc.1
        required: true
        type: string

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - name: Build, smoke, scan, and package the private candidate
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
        run: bash scripts/release-candidate.sh
      - name: Upload private release-candidate evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: my-telegram-gallery-${{ inputs.version }}-${{ github.sha }}
          path: output/release/
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
