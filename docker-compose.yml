name: my-telegram-gallery

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${APP_IMAGE:-my-telegram-gallery:local}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-gallery}:${POSTGRES_PASSWORD:-}@db:5432/${POSTGRES_DB:-gallery}?schema=public
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_ADMIN_APP_SHORT_NAME: ${TELEGRAM_ADMIN_APP_SHORT_NAME:-}
      TELEGRAM_GALLERY_APP_SHORT_NAME: ${TELEGRAM_GALLERY_APP_SHORT_NAME:-}
      TELEGRAM_BOT_API_TEST_MODE: ${TELEGRAM_BOT_API_TEST_MODE:-true}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      TELEGRAM_WEBHOOK_BODY_LIMIT_BYTES: ${TELEGRAM_WEBHOOK_BODY_LIMIT_BYTES:-65536}
      TELEGRAM_BOT_API_TIMEOUT_MS: ${TELEGRAM_BOT_API_TIMEOUT_MS:-5000}
      BILLING_PRO_PRICE_STARS: ${BILLING_PRO_PRICE_STARS:-}
      BILLING_CHECKOUT_TTL_SECONDS: ${BILLING_CHECKOUT_TTL_SECONDS:-900}
      PAY_SUPPORT_CONTACT: ${PAY_SUPPORT_CONTACT:-}
      BILLING_TERMS_URL: ${BILLING_TERMS_URL:-}
      BILLING_PRIVACY_URL: ${BILLING_PRIVACY_URL:-}
      ADMIN_TG_IDS: ${ADMIN_TG_IDS:-}
      TENANCY_MODE: ${TENANCY_MODE:-single}
      TELEGRAM_INIT_DATA_MAX_AGE_SECONDS: ${TELEGRAM_INIT_DATA_MAX_AGE_SECONDS:-3600}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-filesystem}
      STORAGE_TRANSFER_MODE: ${STORAGE_TRANSFER_MODE:-proxy}
      FILESYSTEM_STORAGE_PATH: /data/media
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-26214400}
      UPLOAD_INTENT_TTL_SECONDS: ${UPLOAD_INTENT_TTL_SECONDS:-600}
      MEDIA_URL_SIGNING_SECRET: ${MEDIA_URL_SIGNING_SECRET:-}
      MEDIA_URL_TTL_SECONDS: ${MEDIA_URL_TTL_SECONDS:-3600}
      READINESS_TIMEOUT_MS: ${READINESS_TIMEOUT_MS:-3000}
      JSON_BODY_LIMIT_BYTES: ${JSON_BODY_LIMIT_BYTES:-131072}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      RATE_LIMIT_TTL_MS: ${RATE_LIMIT_TTL_MS:-60000}
      RATE_LIMIT_GENERAL: ${RATE_LIMIT_GENERAL:-120}
      RATE_LIMIT_ADMIN: ${RATE_LIMIT_ADMIN:-60}
      RATE_LIMIT_UPLOAD: ${RATE_LIMIT_UPLOAD:-20}
      RATE_LIMIT_REPORT: ${RATE_LIMIT_REPORT:-5}
      RATE_LIMIT_WEBHOOK: ${RATE_LIMIT_WEBHOOK:-120}
      OPS_TOKEN_SHA256: ${OPS_TOKEN_SHA256:-}
      OPS_ACTOR: ${OPS_ACTOR:-}
      WEB_ORIGINS: ${WEB_ORIGINS:-}
      STATIC_ROOT: /app/static
      RUN_MIGRATIONS_ON_START: ${RUN_MIGRATIONS_ON_START:-true}
    expose:
      - "3000"
    volumes:
      - media_data:/data/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/api/health/ready')
          .then((response) => { if (!response.ok) process.exit(1); })
          .catch(() => process.exit(1))
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 12

  db:
    image: postgres:17.5-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gallery}
      POSTGRES_DB: ${POSTGRES_DB:-gallery}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "${POSTGRES_USER:-gallery}" -d "${POSTGRES_DB:-gallery}"
      interval: 5s
      timeout: 5s
      retries: 20

  caddy:
    image: caddy:2.10.0-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - ${HTTP_PORT:-80}:80
      - ${HTTPS_PORT:-443}:443
      - ${HTTPS_PORT:-443}:443/udp
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

volumes:
  postgres_data:
  media_data:
  caddy_data:
  caddy_config:
