services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: gallery_e2e
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - "127.0.0.1::5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gallery_e2e"]
      interval: 2s
      timeout: 3s
      retries: 30
